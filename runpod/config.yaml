backend: unsloth
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
max_seq_length: 2048
max_prompt_length: 1024
batch_size: 4
gradient_accumulation: 8
num_epochs: 3
learning_rate: 1.0e-4
save_steps: 100
save_total_limit: 3
dpo_beta: 0.1
use_qlora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
bf16: true
logging_steps: 10

data:
  seed: 42
  source: distilled
  distilled_corpus: scenario_dpo_v1

output_dir: experiments/results/runpod
